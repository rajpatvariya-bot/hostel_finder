server.port=8080

# MySQL (create DB: hostel_finder)
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_finder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1437


spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# For demo only: keep a long secret (HS256 requires length)
app.jwt.secret=CHANGE_ME_DEMO_SECRET_CHANGE_LATER_1234567890_CHANGE_ME_DEMO_SECRET_CHANGE_LATER
app.jwt.expMinutes=60

# File uploads
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.flyway.validate-on-migrate=false

# Spring Mail (dummy setup for testing - will log to console if auth fails)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false
