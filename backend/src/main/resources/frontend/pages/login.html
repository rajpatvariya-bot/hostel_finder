<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login & Register - Hostel Finder</title>
    <link rel="stylesheet" href="../css/global.css" />
    <script src="../static/js/components.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="./index.html">
          <span class="brand-badge" aria-hidden="true"></span>
          <span>Hostel Finder</span>
        </a>
        <nav class="nav">
          <a class="btn" href="./index.html">Home</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding: 18px 0;">
      <h1 class="title">User Portal</h1>
      <p class="subtitle">Login to access your student or owner dashboard.</p>

      <div class="card" style="max-width:520px;">
        <div class="card-body">
          <div style="display:flex; justify-content:center; gap:8px; margin-bottom:16px;">
            <button id="toggleLoginBtn" class="btn btn-primary" style="flex:1;">Login</button>
            <button id="toggleRegisterBtn" class="btn" style="flex:1;">Student Register</button>
          </div>

          <!-- LOGIN TAB -->
          <div id="loginSection">
            <div class="field">
              <div class="label">Email</div>
              <input id="loginEmail" class="input" placeholder="you@example.com" />
            </div>
            <div class="field">
              <div class="label">Password</div>
              <input id="loginPassword" type="password" class="input" placeholder="••••••••" />
            </div>
            <button id="loginSubmitBtn" class="btn btn-primary" style="width:100%;">Login</button>
            <div style="text-align:center; margin-top:16px; font-size:14px; display:grid; gap:8px;">
              <div>Don't have an account? <a href="#" id="linkToRegister">Student Register</a></div>
              <div class="muted">Are you a hostel owner? <a href="./owner-register.html" style="color:var(--primary); font-weight:bold;">Register as Owner</a></div>
            </div>
          </div>

          <!-- REGISTER TAB -->
          <div id="registerSection" style="display:none;">
            <div class="field">
              <div class="label">Full Name</div>
              <input id="regName" class="input" placeholder="John Doe" />
            </div>
            <div class="field">
              <div class="label">Email</div>
              <input id="regEmail" class="input" placeholder="you@example.com" />
            </div>
            <div class="field">
              <div class="label">Phone</div>
              <input id="regPhone" class="input" placeholder="1234567890" />
            </div>
            <div class="field">
              <div class="label">Password</div>
              <input id="regPassword" type="password" class="input" placeholder="••••••••" />
            </div>
            <div class="field" style="display:flex; gap:12px;">
              <div style="flex:1;">
                <div class="label">Gender</div>
                <select id="regGender" class="select">
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div style="flex:1;">
                <div class="label">Age</div>
                <input id="regAge" type="number" class="input" placeholder="20" />
              </div>
            </div>
            <button id="registerSubmitBtn" class="btn btn-primary" style="width:100%;">Register</button>
            <div style="text-align:center; margin-top:16px; font-size:14px;">
              Already registered? <a href="#" id="linkToLogin">Login Here</a>
            </div>
          </div>

          <div id="msg" class="notice" style="display:none; margin-top:16px;"></div>
        </div>
      </div>
    </main>

    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
