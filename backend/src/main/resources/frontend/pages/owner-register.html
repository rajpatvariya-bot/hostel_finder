<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Register - Hostel Finder</title>
    <link rel="stylesheet" href="../css/global.css" />
    <script src="../static/js/components.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="./index.html">
          <span class="brand-badge" aria-hidden="true"></span>
          <span>Hostel Finder</span>
        </a>
        <nav class="nav">
          <a class="btn" href="./index.html">Home</a>
          <a class="btn" href="./login.html">Login</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding: 18px 0;">
      <h1 class="title">Hostel Owner Registration</h1>
      <p class="subtitle">Complete the form to register as a hostel owner. Admin will verify your account shortly.</p>

      <div class="card" style="max-width:520px;">
        <div class="card-body">
          <div class="field"><div class="label">Name</div><input id="name" class="input" placeholder="Owner name" /></div>
          <div class="field"><div class="label">Email</div><input id="email" class="input" placeholder="owner@example.com" /></div>
          <div class="field"><div class="label">Phone</div><input id="phone" class="input" placeholder="9999999999" /></div>
          <div class="field"><div class="label">Password</div><input id="password" class="input" type="password" placeholder="••••••••" /></div>

          <div id="msg" class="notice" style="display:none; margin-top:16px;"></div>

          <button id="regBtn" class="btn btn-primary" style="width:100%;">Register as Owner</button>
        </div>
      </div>
    </main>

    <script type="module" src="../js/ownerRegister.js"></script>
  </body>
</html>
