<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Dashboard - Hostel Finder</title>
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="./index.html">
          <span class="brand-badge" aria-hidden="true"></span>
          <span>Hostel Finder</span>
        </a>
        <nav class="nav">
          <a class="btn" href="./index.html">Home</a>
          <button id="logoutBtn" class="btn">Logout</button>
        </nav>
      </div>
    </header>

    <main class="container" style="padding: 24px 0;">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom: 25px;">
        <h1 class="title" style="margin:0;">Dashboard</h1>
        <div style="display:flex; background:rgba(0,0,0,0.2); padding:4px; border-radius:8px;">
          <button id="tabHostels" class="btn btn-primary" style="border-radius:6px; font-weight:600;">My Hostels</button>
          <button id="tabInquiries" class="btn" style="border-radius:6px; font-weight:600;">Student Inquiries</button>
        </div>
      </div>

      <!-- AADHAAR VERIFICATION SECTION -->
      <section id="verificationWidget" class="card" style="margin-bottom: 24px; display:none;">
        <div class="card-body" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h3 style="margin-top:0; margin-bottom:8px;">Identity Verification</h3>
                <div id="verificationStatusText" style="font-size:14px; opacity:0.8;">Checking status...</div>
                <div id="verificationNoteText" style="font-size:13px; color:#dc3545; margin-top:4px; display:none;"></div>
            </div>
            <div id="verificationUploadDiv" style="display:none; align-items:center; gap:10px;">
                <input type="file" id="aadhaarFile" accept=".jpg,.jpeg,.png,.pdf" class="input" style="max-width: 200px;">
                <button id="uploadAadhaarBtn" class="btn btn-primary">Upload Aadhaar</button>
            </div>
        </div>
      </section>

      <!-- HOSTELS SECTION -->
      <section id="sectionHostels">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 style="font-size:1.25rem;">Your Listings</h2>
          <button id="addHostelBtn" class="btn btn-primary">+ Add New Hostel</button>
        </div>
        <div id="hostelList" class="card-grid"></div>
      </section>

      <!-- INQUIRIES SECTION -->
      <section id="sectionInquiries" style="display:none;">
        <h2 style="font-size:1.25rem; margin-bottom:16px;">Student Inquiries</h2>
        <div id="inquiryList" class="card-grid"></div>
      </section>

      <!-- Add Hostel Modal-like Overlay -->
      <div id="hostelModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; backdrop-filter: blur(8px);">
        <div class="card" style="padding:30px; width:90%; max-width:650px; max-height:90vh; overflow-y:auto; border-color: rgba(79,140,255,0.3);">
          <h2 id="modalTitle" class="title" style="margin-top:0;">Add New Hostel</h2>
          <p class="muted" style="margin-bottom:20px;">Fill in the details below to list your hostel on our platform.</p>
          
          <form id="hostelForm" style="display:flex; flex-direction:column; gap:20px;">
            <div class="field">
              <label class="label">Hostel Name</label>
              <input type="text" id="hostelName" required class="input" placeholder="e.g. Sunshine Boys Hostel">
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
              <div class="field">
                <label class="label">City</label>
                <select id="citySelect" required class="select"></select>
              </div>
              <div class="field">
                <label class="label">Area</label>
                <select id="areaSelect" required class="select"></select>
              </div>
            </div>

            <div class="field">
              <label class="label">Full Address</label>
              <input type="text" id="addressLine" required class="input" placeholder="House no, Street name, Near landmark...">
            </div>

            <div class="field">
              <label class="label">Description</label>
              <textarea id="description" class="textarea" placeholder="Describe the atmosphere, rules, and local connectivity..."></textarea>
            </div>

            <div class="field">
              <label class="label">Hostel Image URL</label>
              <input type="url" id="imageUrl" class="input" placeholder="https://images.unsplash.com/photo-...">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
              <div class="field">
                <label class="label">Price Per Month (₹)</label>
                <input type="number" id="price" required class="input" placeholder="5000">
              </div>
              <div class="field">
                <label class="label">Preferred For</label>
                <select id="genderType" required class="select">
                  <option value="BOYS">Only Boys</option>
                  <option value="GIRLS">Only Girls</option>
                  <option value="COED">Co-ed (All)</option>
                </select>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:12px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid var(--border);">
              <input type="checkbox" id="messAvailable" style="width:18px; height:18px; cursor:pointer;">
              <label for="messAvailable" style="cursor:pointer; font-weight:500;">Mess/Food Facility Available</label>
            </div>

            <div class="field">
              <label class="label">Facilities (Check all that apply)</label>
              <div id="facilityCheckboxes" style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; padding:15px; background: rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:12px; max-height:150px; overflow-y:auto;">
                <!-- Dynamically filled -->
                <span class="muted">Fetching facilities...</span>
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
              <div class="field">
                <label class="label">Total Rooms</label>
                <input type="number" id="totalRooms" required value="10" class="input">
              </div>
              <div class="field">
                <label class="label">Available Now</label>
                <input type="number" id="availableRooms" required value="5" class="input">
              </div>
            </div>

            <!-- Room types list -->
            <div class="field">
              <label class="label">Room Types</label>
              <div id="roomTypesContainer" style="display:flex; flex-direction:column; gap:10px; padding:12px; background: rgba(0,0,0,0.02); border:1px solid var(--border); border-radius:8px;">
                <!-- Dynamic room type rows go here -->
              </div>
              <div style="margin-top:8px; text-align:right;">
                <button type="button" id="addRoomTypeBtn" class="btn">+ Add Room Type</button>
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:10px; padding-top:20px; border-top: 1px solid var(--border);">
              <button type="button" id="closeModal" class="btn">Cancel</button>
              <button type="submit" class="btn btn-primary" style="padding-left:30px; padding-right:30px; font-weight:bold;">Save & Publish Hostel</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script type="module" src="../js/ownerDashboard.js"></script>

  </body>
</html>
